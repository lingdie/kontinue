[workspace]
resolver = "2"
members = [
    "crates/kt-protocol",
    "crates/ktd",
    "crates/kontinue-runsc",
    "crates/kontinue-arena",
    "crates/kontinue-carrier",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
kt-protocol = { path = "crates/kt-protocol" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
blake3 = "1.5"
base64 = "0.22"
hex = "0.4"
libc = "0.2"
